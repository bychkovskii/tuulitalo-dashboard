<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд — Чи·Тай / Пи·Ши (недельный)</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0C0D10;
    --bg-2: #14161B;
    --bg-3: #1D2028;
    --bg-4: #262A34;
    --fg: #F0E6D2;
    --fg-2: #9A968C;
    --line: #2A2E38;
    --accent: #8B7BD8;
    --gold: #C9A24E;
    --red: #D04747;
    --teal: #4FA8A0;
    --ink: #151719;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    font-size: 14px;
  }
  header {
    padding: 18px 24px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { margin: 0 0 4px 0; font-size: 19px; color: var(--accent); letter-spacing: .2px; }
  header h1 .chi { color: var(--fg); }
  header h1 .pi { color: var(--teal); }
  header .meta { color: var(--fg-2); font-size: 12px; }
  header .stats { display: flex; gap: 10px; margin-top: 10px; font-size: 11px; flex-wrap: wrap; }
  header .stat { background: var(--bg-3); padding: 4px 10px; border-radius: 4px; color: var(--fg-2); }
  header .stat strong { color: var(--fg); }
  .mode-badge {
    display: inline-block; background: var(--red); color: #FFF;
    padding: 2px 8px; border-radius: 3px; font-size: 10px;
    margin-left: 8px; font-weight: 600;
  }
  .toolbar {
    padding: 8px 24px; background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .btn {
    background: var(--bg-3); color: var(--fg); border: 1px solid #333846;
    border-radius: 4px; padding: 8px 16px; cursor: pointer;
    font-size: 12px; text-decoration: none;
  }
  .btn:hover { background: var(--bg-4); }
  .readonly-banner {
    background: var(--red); color: #FFF; text-align: center;
    padding: 8px; font-size: 12px; font-weight: 600;
  }
  .toast {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--accent); color: #000; padding: 12px 20px;
    border-radius: 4px; font-size: 13px; z-index: 300;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  /* ===== DESKTOP 3x7 GRID ===== */
  .grid-container { padding: 16px 24px; max-width: 1700px; margin: 0 auto; }
  .week-grid { display: grid; grid-template-columns: 62px repeat(7, 1fr); gap: 4px; }
  .grid-corner { background: var(--bg-2); padding: 8px; }
  .grid-day-header {
    background: var(--bg-2); padding: 6px 4px; text-align: center;
    color: var(--accent); font-weight: 600; font-size: 11px;
    border-bottom: 2px solid var(--accent);
  }
  .grid-day-header .day-name { display: block; font-size: 13px; }
  .grid-day-header .day-date { display: block; font-size: 10px; opacity: .7; margin-top: 2px; }
  .grid-day-header .day-theme { display: block; font-size: 10px; color: var(--gold); opacity: .85; margin-top: 3px; }
  .grid-slot-header {
    background: var(--bg-2); padding: 6px 4px; text-align: center;
    color: var(--gold); font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .grid-cell { background: var(--bg); padding: 0; aspect-ratio: 8 / 7; }
  .grid-cell.empty { display: flex; align-items: center; justify-content: center; color: #2A2E38; }
  .mini-tile {
    background: var(--bg-2); border-left: 3px solid var(--accent);
    border-radius: 4px; padding: 8px; cursor: pointer;
    height: 100%; width: 100%; transition: all .15s;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .mini-tile:hover { background: var(--bg-3); transform: translateY(-1px); }
  .mt-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .mt-time { font-size: 14px; font-weight: 700; color: var(--accent); }
  .mt-pillar {
    display: inline-block; width: 18px; height: 18px; border-radius: 50%;
    text-align: center; line-height: 18px; font-size: 10px;
    font-weight: 700; color: #000;
  }
  .mt-title { font-size: 12px; font-weight: 600; color: var(--fg); line-height: 1.3; margin-bottom: 4px; }
  .mt-actual { font-size: 11px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .mt-platforms { font-size: 10px; color: var(--fg-2); margin-top: auto; }

  /* ===== MOBILE TABS ===== */
  .tabs {
    display: none; background: var(--bg-2); border-bottom: 1px solid var(--line);
    overflow-x: auto; position: sticky; top: 108px; z-index: 99;
  }
  .tab {
    padding: 12px 20px; cursor: pointer; color: var(--fg-2);
    border-bottom: 2px solid transparent; font-size: 13px;
    white-space: nowrap; transition: all .2s;
  }
  .tab:hover { color: var(--fg); background: var(--bg-3); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg-3); }
  .tab .day-name { font-weight: 600; }
  .tab .day-date { font-size: 11px; opacity: .7; }
  .tiles-container { display: none; padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
  .post-tile {
    background: var(--bg-2); border: 1px solid var(--bg-3);
    border-left: 4px solid var(--accent); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 12px; cursor: pointer; transition: all .15s;
  }
  .post-tile:hover { background: var(--bg-3); transform: translateY(-1px); }
  .tile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .slot-time { font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; }
  .pillar-badge {
    display: inline-block; width: 24px; height: 24px; border-radius: 50%;
    text-align: center; line-height: 24px; font-size: 12px; font-weight: 700; color: #000;
  }
  .title { margin: 0; font-size: 20px; font-weight: 600; color: var(--fg); flex: 1; }
  .tile-meta { color: var(--fg-2); font-size: 12px; margin-bottom: 10px; }
  .tile-time {
    color: var(--gold); font-size: 16px; font-weight: 600;
    margin-bottom: 10px; padding: 6px 10px;
    background: var(--bg-3); border-radius: 4px; display: inline-block;
  }
  .tile-time .jitter { color: var(--fg-2); font-size: 11px; font-weight: 400; margin-left: 6px; }
  .tile-platforms {
    color: var(--fg-2); font-size: 13px; padding-top: 8px;
    border-top: 1px solid var(--bg-3);
  }
  .tile-platforms strong { color: var(--fg); font-weight: 500; }

  /* ===== REFERENCE BLOCKS ===== */
  .ref-block { padding: 8px 24px 24px; max-width: 1700px; margin: 0 auto; }
  .ref-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-bottom: 12px;
  }
  .ref-card {
    background: var(--bg-2); border: 1px solid var(--bg-3);
    border-radius: 8px; padding: 16px 18px;
  }
  .ref-card h3 {
    margin: 0 0 10px 0; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--fg-2);
  }
  .pillar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pillar-row:last-child { margin-bottom: 0; }
  .pillar-dot {
    width: 20px; height: 20px; border-radius: 50%; flex: 0 0 20px;
    text-align: center; line-height: 20px; font-size: 10px;
    font-weight: 700; color: #000;
  }
  .pillar-name { font-weight: 600; font-size: 13px; }
  .pillar-desc { color: var(--fg-2); font-size: 12px; line-height: 1.5; margin-top: 2px; }
  .plat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--bg-3); font-size: 13px;
  }
  .plat-row:last-child { border-bottom: none; }
  .plat-name { font-weight: 600; }
  .plat-note { color: var(--fg-2); font-size: 12px; }
  .todo { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 12.5px; line-height: 1.75; }
  .todo li::marker { color: var(--accent); }
  .rule-box {
    background: var(--bg-2); border: 1px solid var(--bg-3);
    border-left: 3px solid var(--gold);
    border-radius: 6px; padding: 12px 16px; margin-top: 10px;
    font-size: 12.5px; color: var(--fg-2); line-height: 1.65;
  }
  .rule-box strong { color: var(--fg); }

  /* ===== MODAL ===== */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.8); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--bg-2); border: 1px solid #333846;
    border-radius: 8px; padding: 24px; max-width: 760px;
    width: 100%; max-height: 90vh; overflow-y: auto; position: relative;
  }
  .modal-content h2 { margin-top: 0; color: var(--accent); line-height: 1.3; }
  .modal-content h3 { color: var(--gold); margin-top: 22px; margin-bottom: 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .modal-content .field { margin-bottom: 12px; }
  .modal-content .field-label { font-size: 10.5px; color: var(--fg-2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .08em; }
  .modal-content .field-value { color: var(--fg); font-size: 13.5px; line-height: 1.65; }
  .modal-content .hashtag {
    display: inline-block; background: var(--bg-3); padding: 2px 9px;
    border-radius: 12px; font-size: 11px; margin-right: 5px;
    margin-bottom: 5px; color: var(--accent);
  }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    background: transparent; color: var(--fg-2);
    border: none; font-size: 24px; cursor: pointer;
  }
  .modal-close:hover { color: var(--fg); }
  body.readonly .post-tile, body.readonly .mini-tile { cursor: default; }
  body.readonly .post-tile:hover, body.readonly .mini-tile:hover { transform: none; }
  body.readonly .toolbar { display: none; }

  .grid-container { display: block; }
  .tiles-container { display: none; }
  .tabs { display: none; }
  @media (max-width: 1024px) {
    .grid-container { display: none; }
    .tiles-container { display: block; }
    .tabs { display: flex; }
    .ref-block { padding: 8px 16px 24px; }
  }
  @media print { .toolbar, .tabs { display: none; } .grid-container { display: block; } }
</style>
</head>
<body>

<header>
  <h1><span class="chi">Чи·Тай</span> / <span class="pi">Пи·Ши</span> — недельный дашборд постинга<span class="mode-badge" id="modeBadge" style="display:none;">READ-ONLY</span></h1>
  <div class="meta" id="headMeta"></div>
  <div class="stats" id="headStats"></div>
</header>

<div class="toolbar" id="toolbar">
  <button class="btn" onclick="goToday()">Сегодня</button>
  <button class="btn" onclick="copyReadOnlyLink()">📋 Скопировать ссылку для редактора</button>
  <span style="margin-left:auto; color:var(--fg-2); font-size:11px;">
    Режим просмотра: <code style="background:var(--bg-3);padding:2px 6px;border-radius:3px;">?readonly=1</code>
  </span>
</div>

<div class="readonly-banner" id="readonlyBanner" style="display:none;">
  👁 READ-ONLY — редактирование отключено, только просмотр.
</div>

<div class="tabs" id="tabs"></div>
<div class="grid-container" id="gridContainer"></div>
<div class="tiles-container" id="tiles"></div>

<div class="ref-block" id="refBlock"></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>
<div id="toast" class="toast"></div>

<script src="weekly_data.js"></script>
<script>
let WEEKDATA = null;
let currentDayIndex = 0;

const PLATFORM_INFO = {
  'VK':        { note: 'сообщество + клипы, главная площадка в РФ' },
  'YouTube':   { note: 'Shorts + плейлист по проекту' },
  'TikTok':    { note: 'основной прирост подписчиков' },
  'Instagram': { note: 'Reels + Stories, визуальная подача' },
  'Sreda':     { note: 'текстовый формат, вторичная площадка' }
};

const PILLAR_DESC = {
  'M': 'Мир, герои, локации. Эстетика и эмоция. Это то, что расходится.',
  'K': 'Демонстрация продукта: реальный интерфейс, шаги, возможности.',
  'A': 'Авторы: рукопись, сериалы, заработок. Для тех, кто пишет.',
  'L': 'Миссия и Буквы: зачем проект существует и как он устроен.',
  'Z': 'Прямые призывы к действию. Цель ролика — переход.'
};

function loadData() {
  if (typeof window.WEEKLY_DATA === 'undefined' || !window.WEEKLY_DATA) {
    document.getElementById('gridContainer').innerHTML =
      '<div style="padding:40px;max-width:700px;margin:0 auto">' +
      '<h2 style="color:var(--red)">⚠ Данные не загрузились</h2>' +
      '<p>Файл <code>weekly_data.js</code> не найден рядом с <code>index.html</code>.</p>' +
      '<pre style="background:var(--bg-3);padding:12px;border-radius:4px;color:var(--gold);font-size:11px">' +
      'node regen_weekly_js.js</pre></div>';
    return;
  }
  WEEKDATA = window.WEEKLY_DATA;
  render();
}

function render() {
  renderHead();
  renderTabs();
  renderGrid();
  renderTiles();
  renderRef();
}

function renderHead() {
  const m = WEEKDATA.meta;
  document.getElementById('headMeta').innerHTML =
    'Неделя ' + m.week_number + ' (' + m.year + ') · ' + formatDate(m.start_date) + ' — ' + formatDate(m.end_date) +
    ' · 3 видео/день × 5 платформ = <strong>' + m.total_publications + ' публикаций/неделю</strong>' +
    ' · Слоты: <strong>8:00, 13:00, 20:00 МСК</strong> · Разброс ±' + m.interval_jitter_min + ' мин';

  const counts = {};
  WEEKDATA.days.forEach(d => d.posts.forEach(p => { counts[p.pillar] = (counts[p.pillar] || 0) + 1; }));
  let stats = '<span class="stat"><strong>' + m.total_posts + '</strong> видео/неделю</span>' +
              '<span class="stat"><strong>' + m.total_publications + '</strong> публикаций/неделю</span>';
  Object.keys(WEEKDATA.pillars).forEach(k => {
    if (counts[k]) stats += '<span class="stat"><strong style="color:' + WEEKDATA.pillars[k].color + '">' +
                            counts[k] + '</strong> ' + WEEKDATA.pillars[k].name + '</span>';
  });
  document.getElementById('headStats').innerHTML = stats;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = WEEKDATA.days.map((day, i) =>
    '<div class="tab ' + (i === currentDayIndex ? 'active' : '') + '" onclick="selectDay(' + i + ')">' +
    '<div class="day-name">' + day.dayName + '</div>' +
    '<div class="day-date">' + formatDate(day.date) + '</div></div>'
  ).join('');
}

function renderGrid() {
  let html = '<div class="grid-corner"></div>';
  WEEKDATA.days.forEach(day => {
    html += '<div class="grid-day-header"><span class="day-name">' + day.dayName + '</span>' +
            '<span class="day-date">' + formatDate(day.date) + '</span>' +
            '<span class="day-theme">' + day.dayTheme + '</span></div>';
  });
  const slots = ["08:00", "13:00", "20:00"];
  slots.forEach((slot, sIdx) => {
    html += '<div class="grid-slot-header">' + slot + '</div>';
    WEEKDATA.days.forEach(day => {
      const post = day.posts[sIdx];
      if (!post) { html += '<div class="grid-cell empty">—</div>'; return; }
      const p = WEEKDATA.pillars[post.pillar];
      html += '<div class="grid-cell"><div class="mini-tile" onclick="openBrief(\'' + post.id + '\')" ' +
              'style="border-left-color:' + p.color + '">' +
              '<div class="mt-header"><span class="mt-time">' + post.slot_time + '</span>' +
              '<span class="mt-pillar" style="background:' + p.color + '">' + post.pillar + '</span></div>' +
              '<div class="mt-title">' + post.title + '</div>' +
              '<div class="mt-actual">⏰ ' + post.actual_time + '</div>' +
              '<div class="mt-platforms">' + WEEKDATA.meta.platforms.join(' · ') + '</div>' +
              '</div></div>';
    });
  });
  document.getElementById('gridContainer').innerHTML = '<div class="week-grid">' + html + '</div>';
}

function renderTiles() {
  const day = WEEKDATA.days[currentDayIndex];
  document.getElementById('tiles').innerHTML = day.posts.map(post => {
    const p = WEEKDATA.pillars[post.pillar];
    return '<div class="post-tile" onclick="openBrief(\'' + post.id + '\')" style="border-left-color:' + p.color + '">' +
      '<div class="tile-header"><div class="slot-time">' + post.slot_time + '</div>' +
      '<span class="pillar-badge" style="background:' + p.color + '">' + post.pillar + '</span>' +
      '<h2 class="title">' + post.title + '</h2></div>' +
      '<div class="tile-meta">' + day.dayName + ' · ' + formatDate(day.date) + ' · ' + day.dayTheme +
      ' · ' + post.duration + ' сек · ' + post.location + '</div>' +
      '<div class="tile-time">⏰ Публикация в <strong>' + post.actual_time + '</strong> ' +
      '<span class="jitter">(' + post.slot_time + ' ±' + WEEKDATA.meta.interval_jitter_min + ' мин)</span></div>' +
      '<div class="tile-platforms">' + WEEKDATA.meta.platforms.map(x => '<strong>' + x + '</strong>').join(' · ') + '</div>' +
      '</div>';
  }).join('');
}

function renderRef() {
  let pillars = '';
  Object.keys(WEEKDATA.pillars).forEach(k => {
    const p = WEEKDATA.pillars[k];
    pillars += '<div class="pillar-row"><span class="pillar-dot" style="background:' + p.color + '">' + k + '</span>' +
      '<div><div class="pillar-name">' + p.name + '</div>' +
      '<div class="pillar-desc">' + (PILLAR_DESC[k] || '') + '</div></div></div>';
  });

  let plats = '';
  WEEKDATA.meta.platforms.forEach(name => {
    plats += '<div class="plat-row"><span class="plat-name">' + name + '</span>' +
             '<span class="plat-note">' + (PLATFORM_INFO[name] ? PLATFORM_INFO[name].note : '') + '</span></div>';
  });

  document.getElementById('refBlock').innerHTML =
    '<div class="ref-grid">' +
      '<div class="ref-card"><h3>Контент-столпы</h3>' + pillars + '</div>' +
      '<div class="ref-card"><h3>Площадки</h3>' + plats + '</div>' +
      '<div class="ref-card"><h3>Что сделать до понедельника</h3>' +
        '<ol class="todo">' +
          '<li>Создать аккаунт на всех 5 площадках, оформить обложку, шапку и описание</li>' +
          '<li>Подключить домен tuulitalo.ru в настройках аккаунтов</li>' +
          '<li>Собрать 21 исходник по брифам из этого дашборда</li>' +
          '<li>Подготовить превью-обложку для каждого ролика</li>' +
          '<li>Настроить автопостинг и таймер на слоты 8:00 / 13:00 / 20:00</li>' +
          '<li>Выдать редактору и продюсеру ссылку с ?readonly=1</li>' +
        '</ol>' +
        '<div class="rule-box"><strong>Правило недели:</strong> каждый ролик выходит одновременно на 5 площадок, ' +
        'в одно и то же фактическое время. Не разводить по времени — иначе перестанем считать охват одним материалом.</div>' +
      '</div>' +
    '</div>';
}

function formatDate(ds) {
  const d = new Date(ds);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + months[d.getMonth()];
}

function selectDay(i) { currentDayIndex = i; renderTabs(); renderTiles(); }
function goToday() {
  const today = new Date();
  const idx = WEEKDATA.days.findIndex(d => new Date(d.date).toDateString() === today.toDateString());
  if (idx >= 0) currentDayIndex = idx;
  renderTabs(); renderTiles();
}

function openBrief(postId) {
  let post, day;
  for (let i = 0; i < WEEKDATA.days.length; i++) {
    const k = WEEKDATA.days[i].posts.findIndex(p => p.id === postId);
    if (k >= 0) { day = WEEKDATA.days[i]; post = day.posts[k]; break; }
  }
  if (!post) return;
  const p = WEEKDATA.pillars[post.pillar];
  document.getElementById('modalContent').innerHTML =
    '<button class="modal-close" onclick="closeModal()">&times;</button>' +
    '<h2>' + post.title + ' <span class="hashtag" style="background:' + p.color + ';color:#000;">' +
      post.pillar + ' — ' + p.name + '</span></h2>' +
    '<div style="color:var(--fg-2);font-size:12px;margin-bottom:16px">' +
      day.dayName + ', ' + formatDate(day.date) + ' · ' + day.dayTheme + ' · ' +
      post.duration + ' сек · ' + post.location + '</div>' +
    '<div class="field"><div class="field-label">Слот (плановое)</div>' +
      '<div class="field-value" style="color:var(--accent);font-weight:600;font-size:18px">' + post.slot_time + ' МСК</div></div>' +
    '<div class="field"><div class="field-label">Фактическая публикация</div>' +
      '<div class="field-value" style="color:var(--gold);font-weight:600;font-size:18px">⏰ ' + post.actual_time +
      ' МСК <span style="font-size:12px;color:var(--fg-2);font-weight:400">(±' + WEEKDATA.meta.interval_jitter_min + ' мин)</span></div></div>' +
    '<div class="field"><div class="field-label">Публикуется одновременно на 5 площадок</div>' +
      '<div class="field-value">' + WEEKDATA.meta.platforms.map(x => '<strong>' + x + '</strong>').join(' · ') + '</div></div>' +
    '<h3>Сюжетка</h3><div class="field"><div class="field-value">' + post.story_brief + '</div></div>' +
    '<h3>Бренд-элементы</h3><div class="field"><div class="field-value">' + post.brand_elements + '</div></div>' +
    '<h3>Звук</h3><div class="field"><div class="field-value">' + post.sound + '</div></div>' +
    '<h3>Субтитры</h3><div class="field"><div class="field-value">' + (post.subtitles || '—') + '</div></div>' +
    '<h3>Хештеги</h3><div class="field">' +
      post.hashtags.map(h => '<span class="hashtag">' + h + '</span>').join('') + '</div>';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function copyReadOnlyLink() {
  const url = window.location.origin + window.location.pathname + '?readonly=1';
  navigator.clipboard.writeText(url).then(() => toast('Ссылка скопирована'))
    .catch(() => prompt('Скопируй ссылку:', url));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

const qp = new URLSearchParams(window.location.search);
if (qp.get('readonly') === '1' || qp.get('readonly') === 'true') {
  document.body.classList.add('readonly');
  document.getElementById('readonlyBanner').style.display = 'block';
  document.getElementById('modeBadge').style.display = 'inline-block';
}

loadData();
</script>

</body>
</html>
